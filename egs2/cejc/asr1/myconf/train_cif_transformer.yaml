# =============================================================================
# CIF タグ検出付き Multitask Transformer
# =============================================================================
# train_multitask_transformer.yaml をベースに、CIF 機構を追加。
# モデル: CIFTagTransformerModel (MultitaskTransformerModel 継承)
# 追加 loss:
#   - loss_quantity : |α_sum - N_tokens| (α の積算和を N_tokens に近づける)
#   - loss_tag      : CrossEntropy (最後の fire 表現 → <no>/<yes>/<other>)
# =============================================================================

model: cif_tag
encoder: contextual_block_transformer
decoder: transformer

# Encoder (train_multitask_transformer.yaml と同一)
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 2048
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.0
    input_layer: conv2d
    normalize_before: true
    positionwise_layer_type: linear
    block_size: 48
    hop_size: 19
    look_ahead: 9
    init_average: true
    ctx_pos_enc: true

decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.0
    src_attention_dropout_rate: 0.0
    input_layer: embed
    use_output_layer: true
    normalize_before: true

ctc_conf:
    dropout_rate: 0.1
    ctc_type: builtin
    reduce: true

# =============================================================================
# CIF 固有パラメータ (model_conf に記述)
# =============================================================================
model_conf:
    # --- MultitaskTransformerModel パラメータ ---
    ctc_weight: 0.3
    lsm_weight: 0.1
    length_normalized_loss: false
    use_disfluency_detection: false

    # --- CIF パラメータ ---
    # tag ファイルは整数インデックス (0=<no>, 1=<yes>, 2=<other>) で格納
    # text_int 型でロードされるため、token_list への追加不要
    num_tag_classes: 3
    cif_weight: 0.5       # quantity loss の重み
    tag_weight: 1.0       # タグ分類 loss の重み（全 fire 均等）
    cif_threshold: 1.0    # fire しきい値 (通常 1.0 固定)
    # クラス重み: 逆頻度（学習データの分布から計算）
    #   <no>=48119, <yes>=92421, <other>=56595 → w = yes_count / class_count
    #   w_no=1.92, w_yes=1.00, w_other=1.63
    # 位置重みは廃止（全 fire 均等学習で早期 fire の精度を確保）
    tag_class_weight: [1.92, 1.00, 1.63]

    # --- SPRT パラメータ ---
    # sprt_upper: 停止境界。大きいほど確信が高いときだけ早期確定する（精度重視）。
    # 小さいほど早く確定する（earliness 重視）。dev set の HM で調整する。
    sprt_upper: 2.0

    report_cer: true
    report_wer: true
    extract_feats_in_collect_stats: false

# =============================================================================
# 学習設定 (train_multitask_transformer.yaml と同一)
# =============================================================================
batch_type: numel
batch_bins: 10000000
accum_grad: 8
grad_clip: 5
patience: 10
max_epoch: 150
num_workers: 2

optim: adam
optim_conf:
    lr: 0.001
    betas: [0.9, 0.98]
    eps: 1.0e-08
    weight_decay: 0.000001

scheduler: warmuplr
scheduler_conf:
    warmup_steps: 25000

best_model_criterion:
-   - valid
    - cer
    - min
keep_nbest_models: 10

specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range: [0, 30]
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_range: [0, 40]
    num_time_mask: 2

frontend: default
frontend_conf:
    hop_length: 132

normalize: global_mvn
normalize_conf:
    stats_file: exp/asr_stats_raw_jp_word/train/feats_stats.npz
