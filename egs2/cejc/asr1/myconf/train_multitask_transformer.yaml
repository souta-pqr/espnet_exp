# =============================================================================
# Multitask Transformer Configuration for CEJC Corpus
# =============================================================================
# Purpose: Joint training of ASR + Disfluency Detection
# Tasks: Speech Recognition + Filled pause/repetition detection
# Architecture: Contextual Block Transformer Encoder + Disfluency Transformer Decoder
# Created: 2026-01-15 for CEJC multitask experiments
# Model: Transformer with CTC (not RNN-T)
# =============================================================================

model: multitask_transformer  # New model class
encoder: contextual_block_transformer  # Transformer encoder (not conformer)
decoder: disfluency_transformer  # Disfluency-aware transformer decoder

# Encoder configuration (12-layer Contextual Block Transformer)
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 2048
    num_blocks: 12  # 12 layers
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.0
    input_layer: conv2d
    normalize_before: true
    positionwise_layer_type: linear
    # Contextual block processing settings
    # Frontend: 132 samples hop (8.25ms) -> Conv2d 4x subsampling -> 33ms per frame
    # 1600ms / 33ms ≈ 48 frames, 640ms / 33ms ≈ 19 frames
    block_size: 48   # ~1584ms block (48 * 33ms)
    hop_size: 19     # ~627ms shift (19 * 33ms)
    look_ahead: 9    # ~297ms look-ahead (9 * 33ms)
    init_average: true
    ctx_pos_enc: true

# Decoder configuration (6-layer Disfluency Transformer)
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6  # 6 layers
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.0
    src_attention_dropout_rate: 0.0
    input_layer: embed
    use_output_layer: true
    normalize_before: true
    # Disfluency detection parameters
    disfluency_classes: 4
    disfluency_weight: 1.0  # Weight for disfluency loss

# CTC configuration
ctc_conf:
    dropout_rate: 0.1
    ctc_type: builtin
    reduce: true

# Model-level configuration
model_conf:
    ctc_weight: 0.3  # CTC weight (0.3 as requested)
    lsm_weight: 0.1  # Label smoothing
    length_normalized_loss: false
    use_disfluency_detection: true
    disfluency_classes: 3 # 4 -> 3
    disfluency_weight: 1.0
    report_cer: true
    report_wer: true
    extract_feats_in_collect_stats: false

# Training configuration
batch_type: numel
batch_bins: 8000000 # 800000 -> 8000000
accum_grad: 8
grad_clip: 5
patience: 10
max_epoch: 150
num_workers: 2

# Optimizer
optim: adam
optim_conf:
    lr: 0.001
    betas: [0.9, 0.98]
    eps: 1.0e-08
    weight_decay: 0.000001

# Scheduler
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 25000

# Model selection
best_model_criterion:
-   - valid
    - cer
    - min
keep_nbest_models: 10

# SpecAugment
specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range: [0, 30]
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_range: [0, 40]
    num_time_mask: 2

# Frontend
frontend: default
frontend_conf:
    hop_length: 132

# Normalization
normalize: global_mvn
normalize_conf:
    stats_file: exp/asr_stats_raw_jp_word/train/feats_stats.npz
