# network architecture
# train_asr_transducer_conformer.yaml をベースに、encoder 共有の
# turn-taking (発話区間末予測) マルチタスクを足した設定。
#   L = loss_transducer + turntaking_weight * loss_tag (+ va_weight * loss_va)
# data/<set>/tag を tag_label として渡す (use_turntaking_detection=true)。

# encoder related
encoder: contextual_block_conformer    # contextual_block_conformer is the core of streaming conformer
encoder_conf:
    output_size: 256    # dimension of attention
    attention_heads: 4
    linear_units: 2048  # the number of units of position-wise feed forward
    num_blocks: 12     # the number of encoder blocks
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.0
    input_layer: conv2d # encoder architecture type
    normalize_before: true
    activation_type: swish
    macaron_style: true
    use_cnn_module: true
    cnn_module_kernel: 15
    block_size: 42      # streaming configuration（18→42: 左文脈 12→36 フレーム ≒ 400ms→1.2s。hop/look 据え置きなのでレイテンシ 100ms は不変）
    hop_size: 3         # streaming configuration
    look_ahead:  3      # streaming configuration
    init_average: true  # streaming configuration
    ctx_pos_enc: true   # streaming configuration

# decoder related
decoder: transducer
decoder_conf:
    rnn_type: lstm
    num_layers: 1
    hidden_size: 512
    dropout: 0.1
    dropout_embed: 0.2

joint_net_conf:
    joint_space_size: 640

# model: turn-taking マルチタスク (espnet2.asr.espnet_model_turntaking)
model: turntaking
model_conf:
    ctc_weight: 0.0
    # valid 時の transducer ビームサーチ（CER/WER 計算）はメモリを爆発させ epoch 末で
    # OOM/クラッシュするため無効化（handoff §5-2 の既知問題）。CER は最終デコード stage で測れる。
    report_cer: False
    report_wer: False
    # --- turn-taking multitask（発話全体プール → 1区間1予測）---
    num_tag_classes: 3          # 0=<no>, 1=<yes>, 2=<other>
    turntaking_weight: 0.0      # Stage1=純粋ASR: 区間末損失は使わない（エンコーダはASRのみで学習）
    tt_d_hidden: 128
    tt_dropout: 0.1
    # <no> の取りこぼし対策。methodA の重み比を採用（実験②=重みあり）。
    tag_class_weight: [1.92, 1.0, 1.63]   # [w_no, w_yes, w_other]
    report_turntaking_accuracy: True

#
frontend: default
frontend_conf:
    hop_length: 132

# minibatch related
batch_type: numel
batch_bins: 700000 # 800000 -> 700000
valid_batch_bins: 300000  # 400000 -> 300000

# seed setting
seed: 30 # epoch 42

# optimization related
accum_grad: 8
grad_clip: 5
patience: 10
max_epoch: 20                # speed perturb でデータ 3 倍。1 エポックが 3 倍長いので上限を下げる
                             # 1 エポック 11 分に戻ったので上限を 150 まで上げ、打ち切りは
                             # patience: 10（最良更新が 10 エポック途切れたら終了）に任せる。
# cer_transducer は valid ビームサーチ無効化に伴い使えないため、ビームサーチ不要な指標へ変更。
# valid.loss.best.pth（ASR寄り・総損失）と valid.tag_acc.best.pth（区間末ベスト）の両方を保存する。
best_model_criterion:
-   - valid
    - loss
    - min
-   - valid
    - tag_acc
    - max
keep_nbest_models: 10

optim: adam
optim_conf:
    lr: 0.0005
scheduler: warmuplr     # pytorch v1.1.0+ required
scheduler_conf:
    warmup_steps: 5000
num_att_plot: 0
specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 30
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_range:
    - 0
    - 40
    num_time_mask: 2

# データ供給の並列度。既定の 1 では 197,135 件の flac 読み込みが律速し、
# iter_time 0.387 秒に対し forward_time 0.023 秒（GPU 使用率 0%）だった。
# 32 コアあるので 8 に上げる。学習の中身は変わらない。
num_workers: 8
