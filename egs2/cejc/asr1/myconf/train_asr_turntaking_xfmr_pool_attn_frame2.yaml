# network architecture
# train_asr_transducer_conformer.yaml をベースに、encoder 共有の
# turn-taking (発話区間末予測) マルチタスクを足した設定。
#   L = loss_transducer + turntaking_weight * loss_tag (+ va_weight * loss_va)
# data/<set>/tag を tag_label として渡す (use_turntaking_detection=true)。

# encoder related
encoder: contextual_block_conformer    # contextual_block_conformer is the core of streaming conformer
encoder_conf:
    output_size: 256    # dimension of attention
    attention_heads: 4
    linear_units: 2048  # the number of units of position-wise feed forward
    num_blocks: 12     # the number of encoder blocks
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.0
    input_layer: conv2d # encoder architecture type
    normalize_before: true
    activation_type: swish
    macaron_style: true
    use_cnn_module: true
    cnn_module_kernel: 15
    block_size: 18      # streaming configuration
    hop_size: 3         # streaming configuration
    look_ahead:  3      # streaming configuration
    init_average: true  # streaming configuration
    ctx_pos_enc: true   # streaming configuration

# decoder related
decoder: transducer
decoder_conf:
    rnn_type: lstm
    num_layers: 1
    hidden_size: 512
    dropout: 0.1
    dropout_embed: 0.2

joint_net_conf:
    joint_space_size: 640

# model: turn-taking マルチタスク (espnet2.asr.espnet_model_turntaking)
model: turntaking_xfmr
model_conf:
    ctc_weight: 0.0
    report_cer: False
    report_wer: False
    num_tag_classes: 3
    tag_class_weight: [1.92, 1.0, 1.63]   # [継続, 完了, 相槌]
    tt_head_type: selfattn      # self-attention 1層のみ（FFN/残差/LayerNorm なし）
    tt_xfmr_heads: 4            # self-attention のヘッド数
    tt_xfmr_layers: 1           # transformer を選ぶ場合の層数（selfattn では未使用）
    tt_xfmr_ff: 1024            # 同上
    tt_dropout: 0.1
    tt_d_hidden: 128
    report_turntaking_accuracy: True
    tt_rel_pe: true        # 位置符号を相対に（圧縮系と条件をそろえる）
    tt_past_specaug: false # 過去音声には SpecAug を掛けない（同上）
    tt_past_pool: attn
    # --- フレーム単位学習 ---
    # 波形は切らず、発話後の音声を 0.75 秒足したうえで 1 回だけ符号化し、
    # ヘッドを窓内の 8 か所で読んで損失を平均する。
    # 波形を切る従来方式は切断端が境界として処理され、実運用のストリーミングでは
    # 生じない「音声が途切れた」信号が入る（同じ絶対位置の表現は後続 6 フレームで
    # 確定することを実測済み。cos 類似 1.000 対 0.46）。
    # ヘッドの構造は変えないので、推論時の挙動は従来と同一。
    # 検証も同じ条件（窓内 8 か所の平均）で測る。位置は等間隔なので毎回同じ値になり、
    # 早期終了の基準が学習条件と一致する。前版は境界処理ありの valid で判断しており、
    # 22 エポックで止まっていた（比較相手は 40 エポック）。
    tt_frame_readouts: 8
    tt_frame_win_sec: 0.6
    tt_tail_sec: 0.75

# Stage1(純粋ASR)の重みを読み込み、エンコーダ等は凍結（ASRは数値的に完全不変）
init_param:
   - exp/asr_PUREASR_TAG/valid.loss.ave.pth
freeze_param:
   - frontend
   - normalize
   - encoder
   - decoder
   - joint_network
   - ctc

#
frontend: default
frontend_conf:
    hop_length: 132

# minibatch related
batch_type: numel
batch_bins: 700000 # 800000 -> 700000
valid_batch_bins: 300000  # 400000 -> 300000

# seed setting
seed: 30 # epoch 42

# optimization related
accum_grad: 8
grad_clip: 5
patience: 10
max_epoch: 60    # Transformer+MLP のみ学習＝収束が速い
# cer_transducer は valid ビームサーチ無効化に伴い使えないため、ビームサーチ不要な指標へ変更。
# valid.loss.best.pth（ASR寄り・総損失）と valid.tag_acc.best.pth（区間末ベスト）の両方を保存する。
best_model_criterion:
-   - valid
    - loss
    - min
-   - valid
    - tag_acc
    - max
keep_nbest_models: 10

optim: adam
optim_conf:
    lr: 0.002
scheduler: warmuplr     # pytorch v1.1.0+ required
scheduler_conf:
    warmup_steps: 2500
num_att_plot: 0
specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 30
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_range:
    - 0
    - 40
    num_time_mask: 2
