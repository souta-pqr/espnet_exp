# =============================================================================
# TEASER Stage 2 学習設定
# =============================================================================
# 前提: Stage 1 として train_cif_transformer.yaml で CIFTagTransformerModel を
#       学習済みのチェックポイントが存在すること。
#
# 使い方:
#   espnet2/bin/asr_train.py \
#     --config myconf/train_cif_teaser_stage2.yaml \
#     --init_param <Stage1チェックポイント>
#
# 注意:
#   - training_stage: 2 を指定することで forward() → forward_stage2() が呼ばれる。
#   - stop_head 以外の全パラメータは __init__ 内で freeze される。
#   - stop_threshold と teaser_v は学習しない（dev set の HM sweep で決める）。
#     sweep スクリプトは別途用意すること。
# =============================================================================

model: cif_teaser
encoder: contextual_block_transformer
decoder: transformer

# Encoder（Stage 1 と同一構成）
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 2048
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.0
    input_layer: conv2d
    normalize_before: true
    positionwise_layer_type: linear
    block_size: 48
    hop_size: 19
    look_ahead: 9
    init_average: true
    ctx_pos_enc: true

decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.0
    src_attention_dropout_rate: 0.0
    input_layer: embed
    use_output_layer: true
    normalize_before: true

ctc_conf:
    dropout_rate: 0.1
    ctc_type: builtin
    reduce: true

# =============================================================================
# モデル設定
# =============================================================================
model_conf:
    # --- Stage 1 と共通 ---
    ctc_weight: 0.3
    lsm_weight: 0.1
    length_normalized_loss: false
    use_disfluency_detection: false
    num_tag_classes: 3
    cif_weight: 0.5
    tag_weight: 1.0
    cif_threshold: 1.0
    sprt_upper: 2.0
    report_cer: false
    report_wer: false
    extract_feats_in_collect_stats: false

    # --- TEASER 固有（Stage 2）---
    training_stage: 2          # forward_stage2() を使う
    stop_head_hidden: 64       # stop_head の隠れ層次元（φ が C+3+D=262次元になったため拡張）
    stop_threshold: 0.5        # 推論時のデフォルト閾値（dev sweep で上書きする）
    teaser_v: 2                # 推論時のデフォルト連続回数（dev sweep で上書きする）

# =============================================================================
# 学習設定（stop_head のみ学習するため小さく設定）
# =============================================================================
batch_type: numel
batch_bins: 10000000
accum_grad: 1
grad_clip: 5
patience: 10
max_epoch: 50
num_workers: 2

optim: adam
optim_conf:
    lr: 0.0001          # Stage 1 より小さい lr
    betas: [0.9, 0.98]
    eps: 1.0e-08
    weight_decay: 0.000001

scheduler: warmuplr
scheduler_conf:
    warmup_steps: 1000

best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 5

specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range: [0, 30]
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_range: [0, 40]
    num_time_mask: 2

frontend: default
frontend_conf:
    hop_length: 132

normalize: global_mvn
normalize_conf:
    stats_file: exp/asr_stats_raw_jp_word/train/feats_stats.npz
